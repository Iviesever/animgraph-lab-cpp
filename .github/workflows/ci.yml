name: ci

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify CMake and MQB source ownership
        shell: pwsh
        run: ./scripts/check_source_drift.ps1
      - name: Configure, build, and test with MSVC
        shell: pwsh
        run: ./scripts/run_cmake_msvc.ps1 -Configuration Debug

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja-clang-debug, ninja-gcc-debug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  ubuntu-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Clang ASan and UBSan
        run: cmake --preset ninja-clang-asan
      - name: Build
        run: cmake --build --preset ninja-clang-asan
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset ninja-clang-asan
