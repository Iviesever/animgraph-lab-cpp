name: ci

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure, build, and test with MSVC
        shell: pwsh
        run: ./scripts/run_cmake_msvc.ps1 -Configuration Debug

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        preset: [ninja-clang-debug, ninja-gcc-debug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
